esp32:
  framework:
    advanced:
      signed_ota_verification:
        signing_key: signing_key.pem

external_components:
  - components: [scheduler]
    source: .

http_request:
  buffer_size_rx: 2048
  buffer_size_tx: 2048

ota:
  - encryption:
      key: ${ota_key}
    platform: esphome
  - platform: http_request

packages:
  device: !include device.yaml

update:
  - name: Firmware
    id: firmware
    platform: http_request
    source: https://github.com/zygimantas/esphome-tesla-ble-scheduler/releases/latest/download/manifest.json
    update_interval: never # with an interval, ESPHome also checks at every start

# A check for a release, which the page presses as it opens, rather than one at the start or on a timer: the page's
# Update card shows a release, and it installs only from there.
button:
  - platform: template
    name: Check for update
    entity_category: diagnostic
    on_press:
      - component.update: firmware
