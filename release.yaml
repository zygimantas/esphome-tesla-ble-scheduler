esp32:
  framework:
    advanced:
      signed_ota_verification:
        signing_key: signing_key.pem

external_components:
  - components: [scheduler]
    source: .

http_request:
  buffer_size_rx: 2048
  buffer_size_tx: 2048

ota:
  - encryption:
      key: ${ota_key}
    platform: esphome
  - platform: http_request

packages:
  device: !include device.yaml

update:
  - name: Firmware
    id: firmware
    platform: http_request
    source: https://github.com/zygimantas/esphome-tesla-ble-scheduler/releases/latest/download/manifest.json
    update_interval: never # with an interval, ESPHome also checks at every start

# A check for a release once a day, from a day after the start: the page's Update card shows it, and it installs only
# from there.
interval:
  - interval: 24h
    startup_delay: 24h
    then:
      - component.update: firmware
