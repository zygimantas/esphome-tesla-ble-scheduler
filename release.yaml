button:
  - entity_category: diagnostic
    name: Check for update
    on_press:
      - component.update: firmware
    platform: template

esp32:
  framework:
    advanced:
      signed_ota_verification:
        signing_key: signing_key.pem

external_components:
  - components: [scheduler]
    source: .

http_request:
  buffer_size_rx: 2048
  buffer_size_tx: 2048

ota:
  - encryption:
      key: ${ota_key}
    platform: esphome
  - platform: http_request

packages:
  device: !include device.yaml

update:
  - id: firmware
    name: Firmware
    platform: http_request
    source: https://github.com/zygimantas/esphome-tesla-ble-scheduler/releases/latest/download/manifest.json
    update_interval: never
