esp32:
  framework:
    advanced:
      signed_ota_verification:
        signing_key: signing_key.pem

external_components:
  - components: [scheduler]
    source: .

ota:
  - encryption:
      key: ${ota_key}
    platform: esphome
  - platform: http_request

packages:
  device: !include device.yaml

update:
  - name: Firmware
    platform: http_request
    source: https://github.com/zygimantas/esphome-tesla-ble-scheduler/releases/latest/download/manifest.json
    update_interval: 24h
