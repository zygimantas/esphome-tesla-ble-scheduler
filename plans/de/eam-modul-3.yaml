# EAM Netz Modul 3, three rates, prices with VAT: https://www.eam-netz.de/fileadmin/user_upload/Ueber_Uns/Netzinformation/Netzentgelte/strom/251215_Preisblatt_EAM_Netz_Strom_2026_-_final.pdf
# EAM Netz prints the prices in cents without VAT: these are in euros, with 19% VAT.
# EAM Netz sets the hours and prices for each calendar year: 2027's apply from 1 January, published as preliminary by 15 October 2026.
# Maintained by @zygimantas
currency: EUR
calendar:
  jan-dec:
    mon-sun: low 06:00 standard 11:00 low 15:00 standard 17:00 high 22:00 standard 23:00 low
rates:
  low: 0.01952
  standard: 0.06521
  high: 0.12519
