# Prices with VAT: https://www.primeo-energie.ch/privatkunden/strom-beziehen.html
# Primeo Energie prints the prices in Rappen without VAT: these are the network prices (Netznutzung), in francs, with 8.1% VAT.
# Public holidays are low tariff where the grid and the meter allow it. On 1 January 2027 the prices become 0.14972 (high) and 0.09945 (low).
# Maintained by @zygimantas
name: Primeo Basis, region Basel
currency: CHF
calendar:
  jan-dec:
    mon-fri: low 06:00 high 21:00 low
    sat-sun: low
exceptions:
  01-01: low
  # Good Friday, 2027
  03-26: low
  # Easter Monday, 2027
  03-29: low
  # Ascension, 2027
  05-06: low
  # Whit Monday, 2027
  05-17: low
  08-01: low
  12-25: low
rates:
  high: 0.15350
  low: 0.10215
