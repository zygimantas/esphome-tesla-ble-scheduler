# SonarCloud's analysis, from CI's unit-test job, as only a scan in CI brings in the unit tests' coverage.
sonar.organization=zygimantas-oss
sonar.projectKey=zygimantas_esphome-tesla-ble-scheduler
sonar.cfamily.llvm-cov.reportPath=coverage.txt
# The unit tests cover the plain C++17 headers, all of them. The ESPHome part, the page and the Python run elsewhere.
sonar.coverage.exclusions=scheduler/__init__.py,scheduler/*.cpp,scheduler/scheduler_component.h,test/**,web/**
