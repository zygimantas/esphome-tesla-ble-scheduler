binary_sensor:
  - lambda: return scheduler_test::tesla().plugged;
    name: "Charger"
    platform: template

button:
  - name: "Wake up"
    platform: template

esphome:
  includes:
    - scheduler_test_tesla.h
  name: simulation
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto &controller = id(scheduler_id).controller();
          scheduler_test::load_synthetic_prices(controller.prices, id(sntp_time).now().timestamp);
          controller.reschedule();

external_components:
  - components: [scheduler]
    source: ..

host:

http_request:

interval:
  - interval: 5s
    then:
      - lambda: scheduler_test::tesla().advance(5);

logger:

number:
  - lambda: return scheduler_test::tesla().limit;
    max_value: 100
    min_value: 50
    name: "Charging Limit"
    platform: template
    set_action:
      - lambda: scheduler_test::tesla().limit = x;
    step: 1
    update_interval: 5s

scheduler:
  battery_kwh: 75
  charging_kw: 11
  id: scheduler_id
  market:
    area: LT
    vat: 0.21
  tariff:
    calendar:
      jan-dec:
        mon-sun: flat
    rates:
      flat: 0.11132
  time_id: sntp_time
  vin: 5YJ3E1EA0KF000000

sensor:
  - lambda: return scheduler_test::tesla().soc;
    name: "Battery"
    platform: template
    update_interval: 5s
  - lambda: return scheduler_test::tesla().power_kw();
    name: "Charger Power"
    platform: template
    update_interval: 5s

switch:
  - lambda: return scheduler_test::tesla().charging;
    name: "Charger"
    platform: template
    restore_mode: DISABLED
    turn_off_action:
      - lambda: scheduler_test::tesla().set_charging(false);
    turn_on_action:
      - lambda: scheduler_test::tesla().set_charging(true);

text_sensor:
  - lambda: return scheduler_test::tesla().charging_state();
    name: "Charging"
    platform: template
    update_interval: 5s

time:
  - id: sntp_time
    platform: host
    timezone: Europe/Vilnius
