binary_sensor:
  - lambda: return charging_test::tesla().plugged;
    name: "Charger"
    platform: template

button:
  - name: "Wake up"
    platform: template

charging:
  battery_kwh: 75
  charging_kw: 11
  grid:
    fees:
      a: 0.11132
    hours:
      weekend: aaaaaaaaaaaaaaaaaaaaaaaa
      workday: aaaaaaaaaaaaaaaaaaaaaaaa
    prices:
      area: LT
      vat: 0.21
  id: charging_id
  time_id: sntp_time
  vin: 5YJ3E1EA0KF000000

esphome:
  includes:
    - charging_test_tesla.h
  name: simulation
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto &controller = id(charging_id).controller();
          charging_test::load_synthetic_prices(controller.prices, id(sntp_time).now().timestamp);
          controller.replan();

external_components:
  - components: [charging]
    source: ..

host:

http_request:

interval:
  - interval: 5s
    then:
      - lambda: charging_test::tesla().advance(5);

logger:

number:
  - lambda: return charging_test::tesla().limit;
    max_value: 100
    min_value: 50
    name: "Charging Limit"
    platform: template
    set_action:
      - lambda: charging_test::tesla().limit = x;
    step: 1
    update_interval: 5s

sensor:
  - lambda: return charging_test::tesla().soc;
    name: "Battery"
    platform: template
    update_interval: 5s
  - lambda: return charging_test::tesla().power_kw();
    name: "Charger Power"
    platform: template
    update_interval: 5s

switch:
  - lambda: return charging_test::tesla().charging;
    name: "Charger"
    platform: template
    restore_mode: DISABLED
    turn_off_action:
      - lambda: charging_test::tesla().set_charging(false);
    turn_on_action:
      - lambda: charging_test::tesla().set_charging(true);

text_sensor:
  - lambda: return charging_test::tesla().charging_state();
    name: "Charging"
    platform: template
    update_interval: 5s

time:
  - id: sntp_time
    platform: host
    timezone: Europe/Vilnius
