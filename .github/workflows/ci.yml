name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  ARDUINOJSON_VERSION: 7.4.3
  CLANG_TIDY_VERSION: 22.1.8
  ESPHOME_VERSION: 2026.9.0

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: The versions agree, in config.example.yaml, device.yaml, ci.yml and codeql.yml
        run: |
          version=$(yq '.esphome.project.version' device.yaml)
          template=$(yq '.substitutions.version' config.example.yaml)
          if [ "$template" != "v$version" ]; then
            echo "::error file=config.example.yaml::version is $template, but device.yaml is at $version: make it v$version"
            exit 1
          fi
          if [ "$(yq '.esphome.min_version' device.yaml)" != "$ESPHOME_VERSION" ]; then
            echo "::error file=device.yaml::min_version differs from ESPHOME_VERSION in ci.yml ($ESPHOME_VERSION)"
            exit 1
          fi
          if [ "$(yq '.env.ESPHOME_VERSION' .github/workflows/codeql.yml)" != "$ESPHOME_VERSION" ]; then
            echo "::error file=.github/workflows/codeql.yml::ESPHOME_VERSION differs from ci.yml ($ESPHOME_VERSION)"
            exit 1
          fi

  unit-tests:
    name: Unit tests, coverage and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: LLVM tools, ArduinoJson and the compiler flags
        run: |
          sudo apt-get update -q && sudo apt-get install -q -y llvm
          mkdir ArduinoJson
          curl -sSfL "https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v$ARDUINOJSON_VERSION.tar.gz" |
            tar xz --strip-components=1 -C ArduinoJson
          echo "-std=c++17 -Wall -Wextra -Wshadow -Werror -I . -isystem ArduinoJson/src" > flags
      - name: GCC
        run: g++ @flags test/charging_test.cpp -o charging_test && ./charging_test
      - name: Clang, with undefined behavior and memory errors caught
        run: |
          clang++ @flags -fsanitize=address,undefined -fno-sanitize-recover=all test/charging_test.cpp -o charging_test
          ./charging_test
      - name: Coverage of charging.h, all of it
        run: |
          clang++ @flags -fprofile-instr-generate -fcoverage-mapping test/charging_test.cpp -o charging_test
          LLVM_PROFILE_FILE=charging_test.profraw ./charging_test
          llvm-profdata merge charging_test.profraw -o charging_test.profdata
          llvm-cov report charging_test -instr-profile=charging_test.profdata -show-branch-summary charging/charging.h
          llvm-cov export charging_test -instr-profile=charging_test.profdata -summary-only charging/charging.h |
            python3 -c 'import json, sys
          totals = json.load(sys.stdin)["data"][0]["totals"]
          missed = {k: totals[k]["count"] - totals[k]["covered"] for k in ("lines", "functions", "regions", "branches")}
          sys.exit(f"Not covered: {missed}" if any(missed.values()) else 0)'
      - name: clang-tidy
        run: uvx "clang-tidy==$CLANG_TIDY_VERSION" test/charging_test.cpp -- @flags

  esphome:
    name: ESPHome builds and the simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Secrets, from the example with a random API key
        run: sed "s|random-key-from-esphome.io/components/api|$(openssl rand -base64 32)|" secrets.example.yaml > secrets.yaml
      - name: Simulation, starting a stopped car in a cheap quarter-hour
        run: |
          uvx "esphome@$ESPHOME_VERSION" compile test/simulation.yaml
          CHEAP_NOW=1 START_STOPPED=1 ESPHOME_PREFDIR="$(mktemp -d)" python3 -c 'import pty, sys; pty.spawn(sys.argv[1:])' \
            timeout 50 test/.esphome/build/simulation/.pioenvs/simulation/program > simulation.log
          grep -F '][charging' simulation.log
          grep -q -F 'Start charging (Starting)' simulation.log
      - name: Each price list, as the install checks it
        run: |
          for list in pricelists/*/*.yaml; do
            name=${list#pricelists/}
            currency=$(sed -n 's/^currency: //p' "$list")
            yq ".charging.grid = {\"pricelist\": \"${name%.yaml}\"} | del(.charging.market) | .charging.currency = \"$currency\"" \
              test/simulation.yaml > test/pricelist.yaml
            if ! uvx "esphome@$ESPHOME_VERSION" config test/pricelist.yaml > pricelist.log 2>&1; then
              cat pricelist.log
              echo "::error file=$list::the install rejects ${name%.yaml}"
              exit 1
            fi
          done
      - name: Firmware, as users build it, from this commit on GitHub
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          user=$(mktemp -d)
          cp config.example.yaml secrets.yaml "$user"
          uvx "esphome@$ESPHOME_VERSION" -s version "$COMMIT" -s tesla_vin 5YJ3E1EA0KF000000 compile "$user/config.example.yaml"

  release:
    name: Release the version in device.yaml
    if: github.event_name == 'push'
    needs: [esphome, lint, unit-tests]
    runs-on: ubuntu-24.04
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish it, unless it's out already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(yq '.esphome.project.version' device.yaml)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is out already"
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "ESPHome Tesla BLE Scheduler $version" --generate-notes \
              config.example.yaml secrets.example.yaml
          fi
