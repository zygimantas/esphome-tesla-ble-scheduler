name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  ARDUINOJSON_VERSION: 7.4.3
  CLANG_TIDY_VERSION: 22.1.8
  ESPHOME_VERSION: 2026.10.0b2
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx --no-build pre-commit@4.6.2 run --all-files --show-diff-on-failure
      - name: The versions agree, in config.example.yaml, device.yaml, the workflows and CONTRIBUTING.md
        run: |
          version=$(yq '.esphome.project.version' device.yaml)
          template=$(yq '.substitutions.version' config.example.yaml)
          if [ "$template" != "v$version" ]; then
            echo "::error file=config.example.yaml::version is $template, but device.yaml is at $version: make it v$version"
            exit 1
          fi
          if [ "$(yq '.esphome.min_version' device.yaml)" != "$ESPHOME_VERSION" ]; then
            echo "::error file=device.yaml::min_version differs from ESPHOME_VERSION in ci.yml ($ESPHOME_VERSION)"
            exit 1
          fi
          if [ "$(yq '.env' .github/workflows/codeql.yml)" != "$(yq '.env | del(.CLANG_TIDY_VERSION, .PLAYWRIGHT_VERSION)' .github/workflows/ci.yml)" ]; then
            echo "::error file=.github/workflows/codeql.yml::env differs from ci.yml's"
            exit 1
          fi
          for pin in "clang-tidy==$CLANG_TIDY_VERSION" "esphome@$ESPHOME_VERSION" "playwright==$PLAYWRIGHT_VERSION" "v$ARDUINOJSON_VERSION.tar.gz"; do
            grep -q -F "$pin" CONTRIBUTING.md || { echo "::error file=CONTRIBUTING.md::should say $pin, as ci.yml does"; exit 1; }
          done

  unit-tests:
    name: Unit tests, coverage and clang-tidy
    runs-on: ubuntu-24.04
    env:
      SONARCLOUD: ${{ secrets.SONAR_TOKEN != '' }} # false in pull requests from forks and Dependabot, which get no secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarCloud tells new code by the history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: LLVM tools, ArduinoJson and the compiler flags
        run: |
          sudo apt-get update -q && sudo apt-get install -q -y llvm
          mkdir ArduinoJson
          curl --proto "=https" -sSfL "https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v$ARDUINOJSON_VERSION.tar.gz" |
            tar xz --strip-components=1 -C ArduinoJson
          echo "-std=c++17 -Wall -Wextra -Wshadow -Werror -I . -isystem ArduinoJson/src" > flags
      - name: GCC
        run: g++ @flags test/scheduler_test.cpp -o scheduler_test && ./scheduler_test
      - name: Clang, with undefined behavior and memory errors caught
        run: |
          clang++ @flags -fsanitize=address,undefined -fno-sanitize-recover=all test/scheduler_test.cpp -o scheduler_test
          ./scheduler_test
      - name: Coverage of charger.h, settings.h and the headers they include, all of it
        run: |
          clang++ @flags -fprofile-instr-generate -fcoverage-mapping test/scheduler_test.cpp -o scheduler_test
          LLVM_PROFILE_FILE=scheduler_test.profraw ./scheduler_test
          llvm-profdata merge scheduler_test.profraw -o scheduler_test.profdata
          llvm-cov report scheduler_test -instr-profile=scheduler_test.profdata -show-branch-summary scheduler/*.h
          llvm-cov export scheduler_test -instr-profile=scheduler_test.profdata -summary-only scheduler/*.h |
            python3 -c 'import json, sys
          totals = json.load(sys.stdin)["data"][0]["totals"]
          missed = {k: totals[k]["count"] - totals[k]["covered"] for k in ("lines", "functions", "regions", "branches")}
          sys.exit(f"Not covered: {missed}" if any(missed.values()) else 0)'
          llvm-cov show scheduler_test -instr-profile=scheduler_test.profdata -show-branches=count scheduler/*.h > coverage.txt
      - name: clang-tidy
        run: uvx --no-build "clang-tidy==$CLANG_TIDY_VERSION" test/scheduler_test.cpp -- @flags
      - name: SonarCloud, with the coverage (sonar-project.properties)
        if: env.SONARCLOUD == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  page:
    name: The page on a fake board
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: ArduinoJson, and the board's settings checks built like the unit tests
        run: |
          mkdir ArduinoJson
          curl --proto "=https" -sSfL "https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v$ARDUINOJSON_VERSION.tar.gz" |
            tar xz --strip-components=1 -C ArduinoJson
          g++ -std=c++17 -Wall -Wextra -Wshadow -Werror -I . -isystem ArduinoJson/src test/settings_tool.cpp -o test/settings_tool
      - name: The page in the runner's Chrome, on the fake board
        run: uvx --no-build --from "playwright==$PLAYWRIGHT_VERSION" python test/page_test.py

  esphome:
    name: ESPHome builds and the simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Simulation, starting a stopped car in a cheap quarter-hour
        run: |
          # ESPHOME_PCH_ENABLE=0 leaves out 2026.10's precompiled header, which breaks host builds (test/AGENTS.md)
          ESPHOME_PCH_ENABLE=0 uvx "esphome@$ESPHOME_VERSION" compile test/simulation.yaml
          # pty.spawn gives the program a terminal. Anything that ends it before the timeout (124) fails the step.
          CHEAP_NOW=1 START_STOPPED=1 ESPHOME_PREFDIR="$(mktemp -d)" python3 -c \
            'import os, pty, sys; sys.exit(os.waitstatus_to_exitcode(pty.spawn(sys.argv[1:])) != 124)' \
            timeout 50 test/.esphome/build/simulation/.pioenvs/simulation/program > simulation.log ||
            { cat simulation.log; exit 1; }
          grep -F -e '][scheduler' -e 'The car is charging' simulation.log
          grep -q -F 'The car is charging' simulation.log
      - name: Firmware, as releases ship it, signed, for ESPHome Web and updates
        env:
          SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SIGNING_KEY || '' }}
        run: |
          # Only builds of main get the release key: pull requests are signed with a throwaway one.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            openssl genrsa -out signing_key.pem 3072
          elif [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > signing_key.pem
          else
            echo "::error::The SIGNING_KEY secret is missing: boards take only releases signed with it"
            exit 1
          fi
          # A key nobody keeps for the Tesla package's OTA from a computer, which ESPHome adds back to release.yaml's.
          uvx "esphome@$ESPHOME_VERSION" -s ota_key "$(openssl rand -base64 32)" compile release.yaml
          rm signing_key.pem
          cp .esphome/build/tesla/build/firmware.factory.bin esphome-tesla-ble-scheduler.bin
          cp .esphome/build/tesla/build/firmware.ota.bin esphome-tesla-ble-scheduler.ota.bin
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware
          path: esphome-tesla-ble-scheduler*.bin

  release:
    name: Release the version in device.yaml
    if: github.ref == 'refs/heads/main'
    needs: [esphome, lint, page, unit-tests]
    runs-on: ubuntu-24.04
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firmware
      - name: Publish it, unless it's out already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(yq '.esphome.project.version' device.yaml)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is out already"
          else
            # What boards check when their page opens, at releases/latest/download/manifest.json.
            release="https://github.com/$GITHUB_REPOSITORY/releases"
            # ESPHome's update requires an MD5, which only checks for a damaged download: the signature protects the firmware.
            md5=$(python3 -c 'import hashlib, sys; print(hashlib.md5(open(sys.argv[1], "rb").read(), usedforsecurity=False).hexdigest())' \
              esphome-tesla-ble-scheduler.ota.bin)
            jq -n --arg version "$version" --arg release "$release" --arg md5 "$md5" \
              '{name: "ESPHome Tesla BLE Scheduler", version: $version, builds: [{chipFamily: "ESP32-S3", ota: {
                path: "\($release)/download/v\($version)/esphome-tesla-ble-scheduler.ota.bin", md5: $md5,
                release_url: "\($release)/tag/v\($version)"}}]}' > manifest.json
            gh release create "v$version" --target "$GITHUB_SHA" --title "ESPHome Tesla BLE Scheduler $version" --generate-notes \
              esphome-tesla-ble-scheduler.bin esphome-tesla-ble-scheduler.ota.bin manifest.json
          fi
