name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  ARDUINOJSON_VERSION: 7.4.3
  CLANG_TIDY_VERSION: 22.1.8
  ESPHOME_VERSION: 2026.9.0

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: The versions agree, in config.example.yaml, device.yaml, the workflows and CONTRIBUTING.md
        run: |
          version=$(yq '.esphome.project.version' device.yaml)
          template=$(yq '.substitutions.version' config.example.yaml)
          if [ "$template" != "v$version" ]; then
            echo "::error file=config.example.yaml::version is $template, but device.yaml is at $version: make it v$version"
            exit 1
          fi
          if [ "$(yq '.esphome.min_version' device.yaml)" != "$ESPHOME_VERSION" ]; then
            echo "::error file=device.yaml::min_version differs from ESPHOME_VERSION in ci.yml ($ESPHOME_VERSION)"
            exit 1
          fi
          if [ "$(yq '.env' .github/workflows/codeql.yml)" != "$(yq '.env | del(.CLANG_TIDY_VERSION)' .github/workflows/ci.yml)" ]; then
            echo "::error file=.github/workflows/codeql.yml::env differs from ci.yml's"
            exit 1
          fi
          for pin in "clang-tidy==$CLANG_TIDY_VERSION" "v$ARDUINOJSON_VERSION.tar.gz"; do
            grep -q -F "$pin" CONTRIBUTING.md || { echo "::error file=CONTRIBUTING.md::should say $pin, as ci.yml does"; exit 1; }
          done

  unit-tests:
    name: Unit tests, coverage and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: LLVM tools, ArduinoJson and the compiler flags
        run: |
          sudo apt-get update -q && sudo apt-get install -q -y llvm
          mkdir ArduinoJson
          curl -sSfL "https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v$ARDUINOJSON_VERSION.tar.gz" |
            tar xz --strip-components=1 -C ArduinoJson
          echo "-std=c++17 -Wall -Wextra -Wshadow -Werror -I . -isystem ArduinoJson/src" > flags
      - name: GCC
        run: g++ @flags test/scheduler_test.cpp -o scheduler_test && ./scheduler_test
      - name: Clang, with undefined behavior and memory errors caught
        run: |
          clang++ @flags -fsanitize=address,undefined -fno-sanitize-recover=all test/scheduler_test.cpp -o scheduler_test
          ./scheduler_test
      - name: Coverage of charger.h and the headers it includes, all of it
        run: |
          clang++ @flags -fprofile-instr-generate -fcoverage-mapping test/scheduler_test.cpp -o scheduler_test
          LLVM_PROFILE_FILE=scheduler_test.profraw ./scheduler_test
          llvm-profdata merge scheduler_test.profraw -o scheduler_test.profdata
          llvm-cov report scheduler_test -instr-profile=scheduler_test.profdata -show-branch-summary scheduler/*.h
          llvm-cov export scheduler_test -instr-profile=scheduler_test.profdata -summary-only scheduler/*.h |
            python3 -c 'import json, sys
          totals = json.load(sys.stdin)["data"][0]["totals"]
          missed = {k: totals[k]["count"] - totals[k]["covered"] for k in ("lines", "functions", "regions", "branches")}
          sys.exit(f"Not covered: {missed}" if any(missed.values()) else 0)'
      - name: clang-tidy
        run: uvx "clang-tidy==$CLANG_TIDY_VERSION" test/scheduler_test.cpp -- @flags

  esphome:
    name: ESPHome builds and the simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Secrets, from the example with a random API key and a hotspot password
        run: |
          sed -e "s|random-key-from-esphome.io/components/api|$(openssl rand -base64 32)|" \
            -e 's|"REPLACEME"|"ci-hotspot-password"|' secrets.example.yaml > secrets.yaml
      - name: Simulation, starting a stopped car in a cheap quarter-hour
        run: |
          uvx "esphome@$ESPHOME_VERSION" compile test/simulation.yaml
          # pty.spawn gives the program a terminal. Anything that ends it before the timeout (124) fails the step.
          CHEAP_NOW=1 START_STOPPED=1 ESPHOME_PREFDIR="$(mktemp -d)" python3 -c \
            'import os, pty, sys; sys.exit(os.waitstatus_to_exitcode(pty.spawn(sys.argv[1:])) != 124)' \
            timeout 50 test/.esphome/build/simulation/.pioenvs/simulation/program > simulation.log ||
            { cat simulation.log; exit 1; }
          grep -F '][scheduler' simulation.log
          grep -q -F 'Start charging (Starting)' simulation.log
      - name: Firmware, as users build it, from this commit on GitHub
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          user=$(mktemp -d)
          cp config.example.yaml secrets.yaml "$user"
          uvx "esphome@$ESPHOME_VERSION" -s version "$COMMIT" -s tesla_vin 5YJ3E1EA0KF000000 compile "$user/config.example.yaml"

  release:
    name: Release the version in device.yaml
    if: github.event_name == 'push'
    needs: [esphome, lint, unit-tests]
    runs-on: ubuntu-24.04
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish it, unless it's out already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(yq '.esphome.project.version' device.yaml)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is out already"
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "ESPHome Tesla BLE Scheduler $version" --generate-notes \
              config.example.yaml secrets.example.yaml
          fi
