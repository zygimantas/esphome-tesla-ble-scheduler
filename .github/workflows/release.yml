name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: major when users must edit their settings files, minor for new behavior, patch for fixes
        type: choice
        options: [minor, patch, major]
        default: minor # without it, a run started with no choice, as the GitHub app can, released an empty version

permissions: {}

jobs:
  release:
    name: Open the release's pull request, merge it and publish the release
    # From main only, as a branch made from another would bring that one's changes along.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # CI takes about 7
    permissions:
      actions: write # to run CI
      contents: write # to push its branch and merge it
      pull-requests: write # to open it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(yq '.esphome.project.version' device.yaml)
          IFS=. read -r major minor patch <<< "$old"
          case "$BUMP" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
          esac
          sed -i "s/^    version: $old\$/    version: $new/" device.yaml
          sed -i "s/^  version: v$old\$/  version: v$new/" config.example.yaml
          sed -i "s/${old//./\\.}/$new/g" .github/ISSUE_TEMPLATE/bug_report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v$new"
          git commit -a -m "chore(board): release v$new"
          # Forced over the branch of a run that failed after pushing it, so running again works.
          git push --force origin "release/v$new"
          # GitHub holds the workflows of a pull request this token opens until a maintainer approves them, and a merge it
          # makes starts none: label the pull request here, run CI on its branch for the checks main requires, delete
          # the runs that wait for approval, and once it's merged, run CI on main, which publishes the release. A run
          # that failed after opening the pull request leaves it open for the next.
          [ "$(gh pr view "release/v$new" --json state --jq .state 2> /dev/null)" = OPEN ] ||
            gh pr create --title "chore(board): release v$new" --label maintenance --body-file - <<EOF
          ## What changed and why

          The version in device.yaml, config.example.yaml and the bug report form, for v$new. The Release workflow merges this once CI passes, then runs CI on main, which publishes v$new, and every board installs it within a day.

          ## How it was checked

          CI, which the Release workflow runs on this branch.
          EOF
          gh workflow run ci.yml --ref "release/v$new"
          gh pr merge "release/v$new" --auto --squash
          until [ "$(gh pr view "release/v$new" --json state --jq .state)" = MERGED ]; do
            sleep 30
            gh run list --branch "release/v$new" --status action_required --json databaseId --jq '.[].databaseId' |
              xargs -r -n 1 gh run delete
          done
          gh workflow run ci.yml --ref main
