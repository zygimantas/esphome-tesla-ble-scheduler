name: CodeQL

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ARDUINOJSON_VERSION: 7.4.3
  ESPHOME_VERSION: 2026.10.0b2

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.build-mode == 'manual'
        with:
          enable-cache: false
      - name: Build the unit tests and the simulation
        if: matrix.build-mode == 'manual'
        run: |
          mkdir ArduinoJson
          curl --proto "=https" -sSfL "https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v$ARDUINOJSON_VERSION.tar.gz" |
            tar xz --strip-components=1 -C ArduinoJson
          g++ -std=c++17 -I . -isystem ArduinoJson/src test/scheduler_test.cpp -o scheduler_test
          # ESPHOME_PCH_ENABLE=0 leaves out 2026.10's precompiled header, which breaks host builds (test/AGENTS.md)
          ESPHOME_PCH_ENABLE=0 uvx "esphome@$ESPHOME_VERSION" compile test/simulation.yaml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
