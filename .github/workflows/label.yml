name: Label

on:
  pull_request_target:
    types: [edited, opened]

permissions:
  pull-requests: write

jobs:
  label:
    name: Label the pull request by its title's type
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "${TITLE%%[:(!]*}" in
            fix) label=bug ;;
            feat) label=enhancement ;;
            docs) label=documentation ;;
            build | chore | ci | perf | refactor | revert | test) label=maintenance ;;
            *) label= ;;
          esac
          # A ! before the colon, as in "feat(board)!:", means users must change their settings.
          case "${TITLE%%:*}" in
            *!) breaking=breaking ;;
            *) breaking= ;;
          esac
          # The notes leave maintenance out, so a breaking change is never maintenance.
          [ -n "$breaking" ] && [ "$label" = maintenance ] && label=
          # A retitled pull request loses the labels it had, so the notes follow the title.
          remove=$(printf '%s\n' bug enhancement documentation maintenance breaking |
            grep -v -x -e "${label:-none}" -e "${breaking:-none}" | paste -s -d , -)
          set -- --remove-label "$remove"
          [ -n "$label" ] && set -- "$@" --add-label "$label"
          [ -n "$breaking" ] && set -- "$@" --add-label "$breaking"
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" "$@"
