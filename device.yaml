api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

debug:
  update_interval: never

esp32_ble_tracker:
  on_ble_advertise:
    - then:
        - lambda: |-
            static const std::string car = TeslaBLE::get_vin_advertisement_name(id(scheduler_id).vin().c_str());
            if (x.get_name() == car && id(ble_tesla_id).get_address() != x.address_uint64())
              id(ble_tesla_id).set_address(x.address_uint64());
  scan_parameters:
    continuous: true

esphome:
  includes:
    - <vin_utils.h>
  min_version: 2026.9.0
  name: tesla
  on_boot:
    priority: 800  # before the Tesla component starts, which takes the VIN then
    then:
      - lambda: id(tesla_ble_vehicle_id).set_vin(id(scheduler_id).vin().c_str());
  project:
    name: zygimantas.esphome-tesla-ble-scheduler
    version: 3.2.0

http_request:
  timeout: 15s

logger:
  hardware_uart: UART0

packages:
  yoziru.esphome-tesla-ble:
    files: [packages/dashboard.yml]
    ref: ${tesla_ble_ref}
    url: https://github.com/yoziru/esphome-tesla-ble.git

psram:
  mode: octal
  speed: 80MHz

scheduler:
  id: scheduler_id
  time_id: sntp_time

substitutions:
  ble_mac_address: "00:00:00:00:00:00"
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  tesla_ble_ref: 8b9ec1cb7312f47c8d4d3042fefabc7759eb1a07
  tesla_vin: ""  # the settings file's, from when the board starts
  variant: esp32s3

tesla_ble_vehicle:
  role: CHARGING_MANAGER

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"
  - lambda: return {ESPHOME_PROJECT_VERSION};
    name: Release
    platform: template

time:
  - id: !remove homeassistant_time
  - id: sntp_time
    platform: sntp
    timezone: UTC  # the settings file's, from when the board starts

web_server:
  css_include: web/web_ui.css
  js_include: web/web_ui.js
  js_url: ""
  log: false
  ota: false

wifi:
  ap:
    password: !secret wifi_hotspot_password
  on_connect: !remove
  on_disconnect: !remove
  password: !secret wifi_password
  ssid: !secret wifi_ssid
