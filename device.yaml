api:
  encryption:
  reboot_timeout: 0s

button:
  - name: Factory reset
    platform: factory_reset

debug:
  update_interval: never

esp32_ble_tracker:
  on_ble_advertise:
    - then:
        - lambda: |-
            // The car's Bluetooth name comes from its VIN, which a new board gets with its first settings, without a
            // restart: the Tesla part takes it then.
            static std::string vin = id(scheduler_id).vin(), car = TeslaBLE::get_vin_advertisement_name(vin.c_str());
            if (vin != id(scheduler_id).vin()) {
              vin = id(scheduler_id).vin();
              car = TeslaBLE::get_vin_advertisement_name(vin.c_str());
              id(tesla_ble_vehicle_id).set_vin(vin.c_str());
            }
            if (x.get_name() == car && id(ble_tesla_id).get_address() != x.address_uint64())
              id(ble_tesla_id).set_address(x.address_uint64());
  scan_parameters:
    continuous: true

esphome:
  includes:
    - <vin_utils.h>
  min_version: 2026.9.0
  name: tesla
  on_boot:
    priority: 800
    then:
      - lambda: id(tesla_ble_vehicle_id).set_vin(id(scheduler_id).vin().c_str());
  project:
    name: zygimantas.esphome-tesla-ble-scheduler
    version: 4.10.0

http_request:
  timeout: 15s

improv_serial:

logger:
  hardware_uart: UART0

ota: !remove

packages:
  yoziru.esphome-tesla-ble:
    files: [packages/dashboard.yml]
    ref: ${tesla_ble_ref}
    url: https://github.com/yoziru/esphome-tesla-ble.git

provisioning:
  timeout: 15min

psram:
  mode: octal
  speed: 80MHz

scheduler:
  id: scheduler_id
  time_id: sntp_time

substitutions:
  ble_mac_address: "00:00:00:00:00:00"
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  tesla_ble_ref: 8b9ec1cb7312f47c8d4d3042fefabc7759eb1a07
  tesla_vin: ""
  variant: esp32s3

tesla_ble_vehicle:
  role: CHARGING_MANAGER

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"
  - lambda: return {ESPHOME_PROJECT_VERSION};
    name: Release
    platform: template

time:
  - id: !remove homeassistant_time
  - id: sntp_time
    platform: sntp
    timezone: UTC

web_server:
  css_include: web/web_ui.css
  js_include: web/web_ui.js
  js_url: ""
  log: false
  ota: false

wifi:
  on_connect: !remove
  on_disconnect: !remove
